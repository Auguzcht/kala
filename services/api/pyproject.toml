[project]
name = "kala-api"
version = "0.1.0"
description = "Kala backend (FastAPI): LTI launch, LMS connectors, model router, twin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mangum>=0.17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "PyJWT>=2.9",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "PyLTI1p3>=2.0.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false
