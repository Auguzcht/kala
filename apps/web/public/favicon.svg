<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Self-contained favicon from the current Kala logo (Kala-Logo.png),
       rendered at 64px and embedded as a data URI. Browsers refuse to
       resolve EXTERNAL <image href> inside an SVG favicon (security
       restriction); a data URI is allowed and loads everywhere. -->
  <image href="data:image/png;base64," width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
</svg>
