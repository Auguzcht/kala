<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Self-contained hornbill favicon: the 64px mark embedded as a data URI.
       Browsers refuse to resolve EXTERNAL <image href> inside an SVG favicon
       (security restriction) — that's why the previous version showed blank
       tabs. A data URI is allowed and loads everywhere. -->
  <image href="data:image/png;base64," width="64" height="64" />
</svg>