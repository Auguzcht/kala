name: api-ci

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/**"
      - ".github/workflows/api-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - run: uv sync --locked

      - run: uv run ruff check .
        continue-on-error: true # tighten to blocking once the codebase is ruff-clean

      - name: Import check
        run: uv run python -c "from app.main import app"

      - name: Tests
        run: uv run pytest
        continue-on-error: true # flip once there's a real test suite (services/api has none yet)
